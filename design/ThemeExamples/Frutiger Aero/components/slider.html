<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aqua Glossy Slider</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --slider-value: 42%;
      --aqua: #15bff5;
      --deep-aqua: #009ddc;
      --dark-blue: #086db8;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;

      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(255, 255, 255, 0.98),
          rgba(234, 250, 255, 0.96) 55%,
          rgba(213, 243, 252, 0.95)
        );

      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    .slider-demo {
      width: min(860px, calc(100vw - 40px));
      padding: 38px 48px 42px;

      color: #075d9e;
    }

    .slider-title {
      margin: 0 0 39px;

      font-size: 31px;
      font-weight: 750;
      line-height: 1;
      letter-spacing: -0.7px;

      color: #064f8a;

      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.9),
        0 0 3px rgba(53, 156, 214, 0.3);
    }

    .slider-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 96px;
      align-items: center;
      gap: 28px;
    }

    .range-area {
      position: relative;
      min-width: 0;
    }

    .range-control {
      position: relative;
      height: 52px;

      display: flex;
      align-items: center;
    }

    /*
      The visible track is separate from the native range input.
      This gives us much finer control over the glass effects.
    */
    .track {
      position: absolute;
      left: 0;
      right: 0;
      height: 29px;

      overflow: hidden;
      border-radius: 999px;

      border: 2px solid rgba(144, 211, 239, 0.78);

      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.98) 0%,
          rgba(241, 251, 255, 0.9) 23%,
          rgba(216, 240, 250, 0.72) 54%,
          rgba(236, 248, 253, 0.9) 100%
        );

      box-shadow:
        inset 0 3px 4px rgba(255, 255, 255, 0.98),
        inset 0 -4px 5px rgba(83, 175, 215, 0.18),
        inset 2px 0 4px rgba(107, 188, 223, 0.16),
        inset -2px 0 4px rgba(107, 188, 223, 0.16),

        0 2px 3px rgba(44, 139, 190, 0.2),
        0 5px 9px rgba(46, 156, 209, 0.14),
        0 0 7px rgba(255, 255, 255, 0.95);
    }

    /*
      Bright aqua filled portion.
    */
    .track-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--slider-value);

      border-radius: inherit;

      background:
        /* Bright top highlight */
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.8) 0%,
          rgba(211, 249, 255, 0.34) 13%,
          transparent 29%
        ),

        /* Aqua body */
        linear-gradient(
          180deg,
          #62dfff 0%,
          #26c9fb 24%,
          #10b7ef 58%,
          #009bd8 100%
        );

      box-shadow:
        inset 0 2px 2px rgba(255, 255, 255, 0.72),
        inset 0 -4px 5px rgba(0, 102, 181, 0.32),
        inset -3px 0 5px rgba(0, 130, 211, 0.34),

        0 0 8px rgba(0, 187, 245, 0.82),
        0 2px 7px rgba(0, 137, 207, 0.38);
    }

    /*
      Thin concentrated reflection running across the upper edge.
    */
    .track::after {
      content: "";
      position: absolute;
      z-index: 3;

      left: 12px;
      right: 12px;
      top: 3px;
      height: 4px;

      border-radius: 50%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.76) 12%,
          rgba(255, 255, 255, 0.35) 65%,
          transparent
        );

      filter: blur(0.4px);
      pointer-events: none;
    }

    /*
      The actual range input remains responsible for mouse,
      touch and keyboard interaction, but is visually transparent.
    */
    .range-input {
      position: absolute;
      z-index: 10;
      inset: 0;

      width: 100%;
      height: 52px;
      margin: 0;

      appearance: none;
      -webkit-appearance: none;

      background: transparent;
      cursor: pointer;
      outline: none;
    }

    .range-input::-webkit-slider-runnable-track {
      width: 100%;
      height: 29px;
      background: transparent;
      border: 0;
    }

    .range-input::-webkit-slider-thumb {
      width: 58px;
      height: 58px;
      margin-top: -14px;

      appearance: none;
      -webkit-appearance: none;

      border: 0;
      border-radius: 50%;
      background: transparent;
    }

    .range-input::-moz-range-track {
      width: 100%;
      height: 29px;
      background: transparent;
      border: 0;
    }

    .range-input::-moz-range-progress {
      background: transparent;
    }

    .range-input::-moz-range-thumb {
      width: 58px;
      height: 58px;

      border: 0;
      border-radius: 50%;
      background: transparent;
    }

    /*
      Separate visual knob. Pointer events pass through it
      to the native range input.
    */
    .thumb {
      position: absolute;
      z-index: 8;

      left: var(--slider-value);
      top: 50%;

      width: 58px;
      height: 58px;

      border: 2px solid rgba(116, 204, 239, 0.82);
      border-radius: 50%;

      pointer-events: none;

      transform: translate(-50%, -50%);

      background:
        /* Top-left lens reflection */
        radial-gradient(
          circle at 32% 25%,
          rgba(255, 255, 255, 0.98) 0%,
          rgba(255, 255, 255, 0.75) 12%,
          rgba(255, 255, 255, 0.16) 31%,
          transparent 43%
        ),

        /* Bottom-right aqua refraction */
        radial-gradient(
          circle at 70% 72%,
          rgba(37, 191, 241, 0.32) 0%,
          rgba(87, 211, 246, 0.14) 34%,
          transparent 55%
        ),

        /* Glass body */
        linear-gradient(
          145deg,
          rgba(244, 253, 255, 0.95) 0%,
          rgba(205, 241, 252, 0.78) 44%,
          rgba(160, 222, 244, 0.52) 100%
        );

      box-shadow:
        inset 0 3px 4px rgba(255, 255, 255, 0.98),
        inset 3px 0 5px rgba(255, 255, 255, 0.45),
        inset -4px -5px 7px rgba(29, 159, 218, 0.24),

        0 0 0 2px rgba(232, 250, 255, 0.52),
        0 2px 4px rgba(0, 105, 179, 0.25),
        0 6px 10px rgba(0, 120, 186, 0.18),
        0 0 12px rgba(86, 208, 250, 0.55);
    }

    /*
      Interior ring visible through the glass knob.
    */
    .thumb::before {
      content: "";
      position: absolute;
      inset: 8px;

      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 50%;

      background:
        radial-gradient(
          circle at center,
          rgba(209, 246, 255, 0.2) 0%,
          rgba(255, 255, 255, 0.12) 48%,
          rgba(76, 193, 235, 0.16) 100%
        );

      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.85),
        inset 0 -2px 3px rgba(17, 143, 207, 0.13);
    }

    /*
      Small blue center point.
    */
    .thumb::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      transform: translate(-50%, -50%);

      background: #0caeea;

      box-shadow:
        0 0 3px rgba(0, 152, 226, 0.9),
        0 0 8px rgba(0, 181, 244, 0.62);
    }

    .range-input:hover + .thumb {
      filter: brightness(1.04);
    }

    .range-input:active + .thumb {
      transform: translate(-50%, -50%) scale(0.97);
    }

    .range-input:focus-visible + .thumb {
      outline: 3px solid rgba(30, 165, 228, 0.38);
      outline-offset: 4px;
    }

    .slider-value {
      min-width: 96px;

      font-size: 38px;
      font-weight: 750;
      line-height: 1;
      letter-spacing: -1px;
      text-align: left;

      color: #0876c4;

      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.95),
        0 0 3px rgba(19, 131, 199, 0.24);
    }

    .tick-area {
      position: relative;
      height: 82px;
      margin-top: 2px;
    }

    .ticks {
      position: absolute;
      top: 5px;
      left: 0;
      right: 0;

      display: grid;
      grid-template-columns: repeat(9, 1fr);
      align-items: start;
    }

    .tick {
      justify-self: center;

      width: 3px;
      height: 15px;

      border-radius: 999px;

      background:
        linear-gradient(
          180deg,
          rgba(92, 174, 215, 0.72),
          rgba(81, 160, 205, 0.34)
        );

      box-shadow:
        0 0 2px rgba(76, 169, 216, 0.28);
    }

    .tick:first-child {
      justify-self: start;
      margin-left: 18px;
    }

    .tick:last-child {
      justify-self: end;
      margin-right: 18px;
    }

    .tick:nth-child(odd) {
      height: 17px;
    }

    .labels {
      position: absolute;
      top: 36px;
      left: 0;
      right: 0;

      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }

    .label {
      justify-self: center;

      font-size: 31px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.8px;

      color: #0872bb;

      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.95),
        0 0 3px rgba(38, 137, 195, 0.22);
    }

    .label:first-child {
      justify-self: start;
    }

    .label:last-child {
      justify-self: end;
    }

    @media (max-width: 700px) {
      .slider-demo {
        padding: 30px 24px;
      }

      .slider-line {
        grid-template-columns: minmax(0, 1fr) 72px;
        gap: 18px;
      }

      .slider-title {
        margin-bottom: 28px;
        font-size: 25px;
      }

      .slider-value {
        min-width: 72px;
        font-size: 30px;
      }

      .label {
        font-size: 22px;
      }

      .thumb {
        width: 50px;
        height: 50px;
      }

      .range-input::-webkit-slider-thumb {
        width: 50px;
        height: 50px;
        margin-top: -10px;
      }

      .range-input::-moz-range-thumb {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>

<body>
  <section class="slider-demo">
    <h1 class="slider-title">SLIDER</h1>

    <div class="slider-line">
      <div class="range-area">
        <div class="range-control">
          <div class="track" aria-hidden="true">
            <div class="track-fill"></div>
          </div>

          <input
            class="range-input"
            id="aquaSlider"
            type="range"
            min="0"
            max="100"
            value="42"
            aria-label="Slider percentage"
          >

          <div class="thumb" aria-hidden="true"></div>
        </div>

        <div class="tick-area" aria-hidden="true">
          <div class="ticks">
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
            <span class="tick"></span>
          </div>

          <div class="labels">
            <span class="label">0%</span>
            <span class="label">25%</span>
            <span class="label">50%</span>
            <span class="label">75%</span>
            <span class="label">100%</span>
          </div>
        </div>
      </div>

      <output class="slider-value" id="sliderValue" for="aquaSlider">
        42%
      </output>
    </div>
  </section>

  <script>
    const slider = document.getElementById("aquaSlider");
    const output = document.getElementById("sliderValue");
    const root = document.documentElement;

    function updateSlider() {
      const min = Number(slider.min);
      const max = Number(slider.max);
      const value = Number(slider.value);

      const percentage = ((value - min) / (max - min)) * 100;

      root.style.setProperty("--slider-value", `${percentage}%`);
      output.value = `${value}%`;
      output.textContent = `${value}%`;
    }

    slider.addEventListener("input", updateSlider);

    updateSlider();
  </script>
</body>
</html>
