<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Open Album Button</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --button-width: 420px;
      --button-height: 138px;
      --button-radius: 28px;
      --rim-width: 7px;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px;

      display: grid;
      place-items: center;

      background:
        radial-gradient(
          ellipse 75% 85% at 50% 25%,
          rgba(255, 255, 255, 0.96) 0%,
          rgba(235, 250, 255, 0.72) 47%,
          transparent 76%
        ),
        linear-gradient(
          180deg,
          #edfaff 0%,
          #cceefa 100%
        );

      font-family:
        "Segoe UI",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    /* =========================================================
       BUTTON
       ========================================================= */

    .open-album-button {
      --body-color: rgba(225, 244, 251, 0.98);

      --rim-dark: rgba(20, 111, 165, 0.88);
      --rim-medium: rgba(91, 186, 225, 0.82);
      --rim-light: rgba(216, 248, 255, 0.98);

      --inner-edge: rgba(25, 107, 159, 0.22);
      --outer-glow: rgba(65, 183, 230, 0.33);
      --text-color: #13568d;

      position: relative;
      isolation: isolate;

      width: min(
        var(--button-width),
        calc(100vw - 40px)
      );

      height: var(--button-height);
      padding: 0 36px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: var(--button-radius);

      background: transparent;
      color: var(--text-color);

      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      box-shadow:
        0 1px 1px rgba(255, 255, 255, 0.88),
        0 3px 4px rgba(26, 104, 153, 0.2),
        0 10px 16px rgba(28, 110, 158, 0.19),
        0 19px 30px rgba(47, 153, 198, 0.12),
        0 0 15px var(--outer-glow);

      transition:
        transform 120ms ease,
        filter 150ms ease,
        box-shadow 150ms ease;
    }

    /* =========================================================
       FEATHERED LIQUID RIM
       ========================================================= */

    .liquid-rim {
      position: absolute;
      z-index: 0;
      pointer-events: none;

      inset: 0;
      padding: var(--rim-width);

      border-radius: inherit;

      background:
        /* Broad upper-left reflection */
        radial-gradient(
          ellipse 47% 34% at 16% -3%,
          rgba(255, 255, 255, 1) 0%,
          rgba(255, 255, 255, 0.96) 4%,
          rgba(229, 250, 255, 0.8) 14%,
          rgba(166, 227, 248, 0.5) 32%,
          rgba(70, 171, 216, 0.2) 56%,
          transparent 82%
        ),

        /* Upper-right reflection */
        radial-gradient(
          ellipse 38% 31% at 84% -2%,
          rgba(255, 255, 255, 0.96) 0%,
          rgba(255, 255, 255, 0.84) 6%,
          rgba(218, 246, 255, 0.64) 17%,
          rgba(137, 211, 240, 0.38) 36%,
          rgba(50, 153, 204, 0.14) 60%,
          transparent 84%
        ),

        /* Lower-left reflection */
        radial-gradient(
          ellipse 42% 30% at 18% 103%,
          rgba(255, 255, 255, 0.94) 0%,
          rgba(240, 253, 255, 0.78) 7%,
          rgba(183, 234, 250, 0.52) 20%,
          rgba(94, 191, 225, 0.28) 42%,
          transparent 80%
        ),

        /* Strong lower-right reflection */
        radial-gradient(
          ellipse 52% 32% at 82% 104%,
          rgba(255, 255, 255, 1) 0%,
          rgba(255, 255, 255, 0.94) 5%,
          rgba(219, 248, 255, 0.72) 16%,
          rgba(139, 216, 242, 0.42) 36%,
          rgba(46, 154, 204, 0.16) 60%,
          transparent 84%
        ),

        /* Curved side illumination */
        radial-gradient(
          ellipse 20% 80% at 0% 50%,
          rgba(238, 253, 255, 0.74) 0%,
          rgba(137, 218, 244, 0.4) 32%,
          rgba(22, 132, 187, 0.16) 62%,
          transparent 84%
        ),

        radial-gradient(
          ellipse 20% 80% at 100% 50%,
          rgba(235, 252, 255, 0.7) 0%,
          rgba(133, 214, 241, 0.36) 32%,
          rgba(18, 125, 182, 0.16) 62%,
          transparent 84%
        ),

        /* Continuous glass color underneath */
        linear-gradient(
          180deg,
          var(--rim-light) 0%,
          var(--rim-medium) 27%,
          var(--rim-dark) 65%,
          var(--rim-medium) 84%,
          var(--rim-light) 100%
        );

      /*
        Remove the center of the gradient layer,
        leaving only a rounded border ring.
      */
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

      -webkit-mask-composite: xor;

      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

      mask-composite: exclude;

      filter:
        blur(0.45px)
        saturate(1.04);

      transition:
        filter 150ms ease,
        opacity 150ms ease;
    }

    /*
      Soft glow outside the acrylic rim.
    */
    .liquid-rim::before {
      content: "";
      position: absolute;
      z-index: -1;

      inset: 1px;
      border-radius: inherit;

      box-shadow:
        0 0 4px rgba(255, 255, 255, 0.78),
        0 0 12px var(--outer-glow);

      opacity: 0.72;

      transition:
        opacity 150ms ease,
        box-shadow 150ms ease;
    }

    /*
      Long, softly feathered specular streaks.
    */
    .liquid-rim::after {
      content: "";
      position: absolute;

      inset: 0;
      border-radius: inherit;

      background:
        radial-gradient(
          ellipse 38% 8% at 23% 1%,
          rgba(255, 255, 255, 0.92) 0%,
          rgba(255, 255, 255, 0.7) 9%,
          rgba(221, 248, 255, 0.32) 34%,
          transparent 80%
        ),

        radial-gradient(
          ellipse 30% 7% at 78% 1%,
          rgba(255, 255, 255, 0.84) 0%,
          rgba(238, 252, 255, 0.54) 17%,
          rgba(177, 231, 248, 0.22) 43%,
          transparent 81%
        ),

        radial-gradient(
          ellipse 36% 8% at 20% 99%,
          rgba(255, 255, 255, 0.82) 0%,
          rgba(228, 249, 255, 0.48) 19%,
          rgba(142, 216, 241, 0.18) 46%,
          transparent 82%
        ),

        radial-gradient(
          ellipse 48% 9% at 78% 99%,
          rgba(255, 255, 255, 0.96) 0%,
          rgba(255, 255, 255, 0.68) 10%,
          rgba(207, 243, 255, 0.3) 36%,
          transparent 82%
        );

      filter: blur(1.6px);
      opacity: 0.92;

      transition:
        opacity 150ms ease,
        filter 150ms ease;
    }

    /* =========================================================
       FLAT RECESSED CENTER
       ========================================================= */

    .button-surface {
      position: absolute;
      z-index: 1;
      pointer-events: none;

      inset: var(--rim-width);

      border-radius:
        calc(
          var(--button-radius) -
          var(--rim-width)
        );

      background: var(--body-color);

      border:
        1px solid rgba(255, 255, 255, 0.52);

      box-shadow:
        /* Dark seam below the raised rim */
        0 0 0 1px var(--inner-edge),

        /* Slightly inset center surface */
        inset 0 4px 7px rgba(35, 120, 166, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.68),
        inset 0 -2px 3px rgba(255, 255, 255, 0.48);

      transition:
        background 150ms ease,
        box-shadow 150ms ease,
        transform 120ms ease;
    }

    /*
      Subtle illumination only. The body remains mostly flat.
    */
    .button-surface::before {
      content: "";
      position: absolute;

      inset: 0;
      border-radius: inherit;

      background:
        radial-gradient(
          ellipse 80% 54% at 50% -18%,
          rgba(255, 255, 255, 0.28) 0%,
          rgba(255, 255, 255, 0.1) 42%,
          transparent 76%
        );
    }

    /* =========================================================
       CONTENT
       ========================================================= */

    .button-content {
      position: relative;
      z-index: 4;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 24px;

      pointer-events: none;
    }

    .cd-icon {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;

      overflow: visible;

      filter:
        drop-shadow(0 1px 0 rgba(255, 255, 255, 0.8))
        drop-shadow(0 2px 2px rgba(10, 79, 131, 0.18));

      transition:
        transform 120ms ease,
        filter 150ms ease;
    }

    .button-label {
      white-space: nowrap;

      color: var(--text-color);

      font-size: 38px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -1px;

      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.96),
        0 0 3px rgba(255, 255, 255, 0.45),
        0 2px 2px rgba(13, 73, 119, 0.12);
    }

    /* =========================================================
       HOVER
       ========================================================= */

    .open-album-button:hover {
      --body-color: rgba(234, 248, 253, 0.99);
      --outer-glow: rgba(96, 204, 244, 0.48);

      transform: translateY(-1px);

      filter:
        brightness(1.025)
        saturate(1.02);

      box-shadow:
        0 1px 1px rgba(255, 255, 255, 0.94),
        0 4px 5px rgba(26, 104, 153, 0.18),
        0 12px 20px rgba(28, 110, 158, 0.21),
        0 21px 34px rgba(47, 153, 198, 0.14),
        0 0 20px var(--outer-glow);
    }

    .open-album-button:hover .liquid-rim {
      filter:
        blur(0.4px)
        brightness(1.09)
        saturate(1.04);
    }

    .open-album-button:hover .liquid-rim::before {
      opacity: 0.94;

      box-shadow:
        0 0 6px rgba(255, 255, 255, 0.94),
        0 0 17px var(--outer-glow);
    }

    .open-album-button:hover .liquid-rim::after {
      opacity: 1;
      filter: blur(1.8px);
    }

    .open-album-button:hover .button-surface {
      box-shadow:
        0 0 0 1px rgba(25, 107, 159, 0.18),

        inset 0 3px 6px rgba(35, 120, 166, 0.09),
        inset 0 1px 1px rgba(255, 255, 255, 0.82),
        inset 0 -2px 3px rgba(255, 255, 255, 0.54);
    }

    .open-album-button:hover .cd-icon {
      filter:
        drop-shadow(0 1px 0 rgba(255, 255, 255, 0.96))
        drop-shadow(0 2px 2px rgba(10, 79, 131, 0.15))
        drop-shadow(0 0 3px rgba(92, 189, 231, 0.2));
    }

    /* =========================================================
       PRESSED
       ========================================================= */

    .open-album-button:active {
      --body-color: rgba(202, 228, 239, 0.99);
      --rim-dark: rgba(10, 84, 135, 0.94);
      --rim-medium: rgba(55, 147, 191, 0.86);
      --rim-light: rgba(181, 229, 243, 0.92);
      --outer-glow: rgba(35, 137, 188, 0.24);

      transform: translateY(2px);

      filter:
        brightness(0.96)
        saturate(0.98);

      box-shadow:
        0 1px 2px rgba(17, 79, 123, 0.23),
        0 5px 9px rgba(21, 93, 139, 0.17),
        0 0 10px var(--outer-glow);
    }

    .open-album-button:active .liquid-rim {
      filter:
        blur(0.35px)
        brightness(0.92)
        saturate(0.98);
    }

    .open-album-button:active .liquid-rim::before {
      opacity: 0.45;
    }

    .open-album-button:active .liquid-rim::after {
      opacity: 0.48;
    }

    .open-album-button:active .button-surface {
      transform: translateY(1px);

      box-shadow:
        0 0 0 1px rgba(9, 75, 122, 0.3),

        inset 0 7px 11px rgba(20, 92, 138, 0.2),
        inset 0 2px 3px rgba(18, 85, 130, 0.1),
        inset 0 -1px 2px rgba(255, 255, 255, 0.42);
    }

    .open-album-button:active .button-content {
      transform: translateY(2px);
    }

    .open-album-button:active .cd-icon {
      transform: scale(0.97);
    }

    /* =========================================================
       ACCESSIBILITY
       ========================================================= */

    .open-album-button:focus-visible {
      outline:
        3px solid rgba(255, 255, 255, 0.98);

      outline-offset: 6px;

      box-shadow:
        0 0 0 4px rgba(39, 151, 207, 0.45),
        0 10px 18px rgba(28, 110, 158, 0.19),
        0 0 18px rgba(72, 191, 237, 0.42);
    }

    @media (max-width: 520px) {
      :root {
        --button-height: 104px;
        --button-radius: 24px;
        --rim-width: 6px;
      }

      body {
        padding: 24px;
      }

      .open-album-button {
        padding: 0 24px;
      }

      .button-content {
        gap: 18px;
      }

      .cd-icon {
        width: 46px;
        height: 46px;
      }

      .button-label {
        font-size: clamp(27px, 8vw, 34px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .open-album-button,
      .liquid-rim,
      .button-surface,
      .cd-icon {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <button class="open-album-button" type="button">
    <span class="liquid-rim" aria-hidden="true"></span>
    <span class="button-surface" aria-hidden="true"></span>

    <span class="button-content">
      <!-- Simple CD icon -->
      <svg
        class="cd-icon"
        viewBox="0 0 64 64"
        aria-hidden="true"
      >
        <circle
          cx="32"
          cy="32"
          r="25"
          fill="none"
          stroke="currentColor"
          stroke-width="3.5"
        />

        <circle
          cx="32"
          cy="32"
          r="7"
          fill="none"
          stroke="currentColor"
          stroke-width="3.5"
        />

        <path
          d="M18 20
             A20 20 0 0 1 25 15"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
        />

        <path
          d="M46 44
             A20 20 0 0 1 39 49"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
        />
      </svg>

      <span class="button-label">Open Album</span>
    </span>
  </button>
</body>
</html>
