<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Liquid Aero Sidebar Navigation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --nav-width: 390px;
      --nav-height: 78px;
      --nav-radius: 21px;
      --rim-width: 5px;

      --blue-dark: #075d98;
      --blue-medium: #1687c2;
      --cyan: #14b9ec;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 42px;

      display: grid;
      place-items: center;

      background:
        radial-gradient(
          ellipse 80% 75% at 50% 22%,
          rgba(255, 255, 255, 0.98) 0%,
          rgba(235, 250, 255, 0.76) 48%,
          transparent 78%
        ),
        linear-gradient(
          180deg,
          #edfaff 0%,
          #cbeefa 100%
        );

      font-family:
        "Segoe UI",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    .sidebar-demo {
      width: min(
        var(--nav-width),
        calc(100vw - 40px)
      );
    }

    .demo-title {
      margin: 0 0 25px 7px;

      color: #064f85;

      font-size: 21px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.35px;
      text-transform: uppercase;

      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.94);
    }

    .nav-list {
      display: grid;
      gap: 17px;
    }

    /* =========================================================
       SHARED NAV ITEM
       ========================================================= */

    .nav-item {
      --surface-top: rgba(241, 251, 255, 0.98);
      --surface-bottom: rgba(210, 235, 245, 0.98);

      --rim-dark: rgba(18, 103, 158, 0.84);
      --rim-medium: rgba(105, 194, 228, 0.8);
      --rim-light: rgba(226, 250, 255, 0.98);

      --text-color: #12578a;
      --icon-color: #125f94;
      --outer-glow: rgba(67, 181, 227, 0.2);

      position: relative;
      isolation: isolate;

      width: 100%;
      height: var(--nav-height);
      padding: 0 21px 0 25px;

      display: flex;
      align-items: center;

      border: 0;
      border-radius: var(--nav-radius);

      color: var(--text-color);
      background: transparent;

      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      box-shadow:
        0 1px 1px rgba(255, 255, 255, 0.9),
        0 3px 5px rgba(22, 97, 145, 0.16),
        0 10px 17px rgba(30, 120, 169, 0.14),
        0 0 12px var(--outer-glow);

      transition:
        transform 120ms ease,
        filter 150ms ease,
        box-shadow 150ms ease;
    }

    /*
      Liquid metallic perimeter shared with the previous
      button components.
    */
    .nav-rim {
      position: absolute;
      z-index: 0;
      pointer-events: none;

      inset: 0;
      padding: var(--rim-width);

      border-radius: inherit;

      background:
        /* Upper-left reflection */
        radial-gradient(
          ellipse 52% 34% at 14% -4%,
          rgba(255, 255, 255, 1) 0%,
          rgba(255, 255, 255, 0.96) 5%,
          rgba(226, 249, 255, 0.8) 16%,
          rgba(153, 222, 246, 0.48) 34%,
          rgba(56, 158, 207, 0.17) 59%,
          transparent 84%
        ),

        /* Upper-right reflection */
        radial-gradient(
          ellipse 43% 31% at 84% -3%,
          rgba(255, 255, 255, 0.98) 0%,
          rgba(241, 253, 255, 0.85) 7%,
          rgba(208, 244, 255, 0.62) 20%,
          rgba(119, 204, 236, 0.35) 41%,
          rgba(28, 135, 190, 0.13) 65%,
          transparent 86%
        ),

        /* Lower-left reflection */
        radial-gradient(
          ellipse 43% 30% at 17% 104%,
          rgba(255, 255, 255, 0.94) 0%,
          rgba(238, 252, 255, 0.77) 8%,
          rgba(174, 230, 249, 0.49) 22%,
          rgba(76, 177, 217, 0.24) 44%,
          transparent 82%
        ),

        /* Strong lower-right sheen */
        radial-gradient(
          ellipse 55% 32% at 84% 105%,
          rgba(255, 255, 255, 1) 0%,
          rgba(255, 255, 255, 0.95) 5%,
          rgba(215, 248, 255, 0.72) 17%,
          rgba(130, 213, 241, 0.42) 37%,
          rgba(35, 145, 197, 0.15) 62%,
          transparent 85%
        ),

        /* Side illumination */
        radial-gradient(
          ellipse 19% 88% at 0% 50%,
          rgba(239, 253, 255, 0.76) 0%,
          rgba(137, 217, 243, 0.39) 34%,
          rgba(17, 125, 181, 0.15) 64%,
          transparent 85%
        ),

        radial-gradient(
          ellipse 19% 88% at 100% 50%,
          rgba(238, 253, 255, 0.74) 0%,
          rgba(133, 214, 241, 0.37) 34%,
          rgba(15, 121, 178, 0.15) 64%,
          transparent 85%
        ),

        linear-gradient(
          180deg,
          var(--rim-light) 0%,
          var(--rim-medium) 27%,
          var(--rim-dark) 65%,
          var(--rim-medium) 84%,
          var(--rim-light) 100%
        );

      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

      -webkit-mask-composite: xor;

      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

      mask-composite: exclude;

      filter:
        blur(0.38px)
        saturate(1.04);
    }

    .nav-rim::before {
      content: "";
      position: absolute;
      z-index: -1;

      inset: 1px;

      border-radius: inherit;

      box-shadow:
        0 0 4px rgba(255, 255, 255, 0.76),
        0 0 12px var(--outer-glow);

      opacity: 0.72;
    }

    .nav-rim::after {
      content: "";
      position: absolute;

      inset: 0;

      border-radius: inherit;

      background:
        radial-gradient(
          ellipse 39% 9% at 22% 1%,
          rgba(255, 255, 255, 0.94) 0%,
          rgba(255, 255, 255, 0.68) 11%,
          rgba(216, 246, 255, 0.29) 37%,
          transparent 82%
        ),

        radial-gradient(
          ellipse 31% 8% at 79% 1%,
          rgba(255, 255, 255, 0.86) 0%,
          rgba(237, 252, 255, 0.53) 18%,
          rgba(164, 225, 247, 0.19) 45%,
          transparent 82%
        ),

        radial-gradient(
          ellipse 41% 9% at 19% 99%,
          rgba(255, 255, 255, 0.83) 0%,
          rgba(224, 248, 255, 0.47) 20%,
          rgba(128, 208, 236, 0.17) 48%,
          transparent 83%
        ),

        radial-gradient(
          ellipse 50% 10% at 79% 99%,
          rgba(255, 255, 255, 0.97) 0%,
          rgba(255, 255, 255, 0.68) 11%,
          rgba(199, 240, 254, 0.29) 38%,
          transparent 84%
        );

      filter: blur(1.5px);
      opacity: 0.92;
    }

    /* =========================================================
       RECESSED CENTER SURFACE
       ========================================================= */

    .nav-surface {
      position: absolute;
      z-index: 1;
      pointer-events: none;

      inset: var(--rim-width);

      overflow: hidden;

      border:
        1px solid rgba(255, 255, 255, 0.52);

      border-radius:
        calc(
          var(--nav-radius) -
          var(--rim-width)
        );

      background:
        radial-gradient(
          ellipse 96% 100% at 50% -25%,
          rgba(255, 255, 255, 0.7) 0%,
          rgba(255, 255, 255, 0.22) 38%,
          transparent 72%
        ),

        linear-gradient(
          180deg,
          var(--surface-top) 0%,
          var(--surface-bottom) 100%
        );

      box-shadow:
        0 0 0 1px rgba(17, 94, 146, 0.2),

        inset 0 4px 7px rgba(28, 110, 158, 0.13),
        inset 0 1px 2px rgba(255, 255, 255, 0.84),
        inset 0 -3px 4px rgba(255, 255, 255, 0.47);
    }

    /*
      Soft diagonal lens reflection.
    */
    .nav-surface::before {
      content: "";
      position: absolute;

      top: -78px;
      right: 36px;

      width: 105px;
      height: 235px;

      transform: rotate(31deg);

      background:
        linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.03) 13%,
          rgba(255, 255, 255, 0.13) 34%,
          rgba(255, 255, 255, 0.31) 49%,
          rgba(255, 255, 255, 0.14) 64%,
          rgba(255, 255, 255, 0.03) 80%,
          transparent 100%
        );

      filter: blur(7px);
      opacity: 0.55;
    }

    /* =========================================================
       CONTENT
       ========================================================= */

    .nav-content {
      position: relative;
      z-index: 4;

      width: 100%;

      display: flex;
      align-items: center;
      gap: 17px;

      pointer-events: none;
    }

    .nav-icon {
      width: 43px;
      height: 43px;
      flex: 0 0 auto;

      color: var(--icon-color);

      filter:
        drop-shadow(
          0 1px 0 rgba(255, 255, 255, 0.78)
        );

      transition:
        transform 120ms ease,
        filter 150ms ease;
    }

    .nav-label {
      min-width: 0;

      flex: 1;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;

      color: var(--text-color);

      font-size: 26px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.55px;

      text-align: left;
    }

    .nav-chevron {
      width: 22px;
      height: 34px;
      flex: 0 0 auto;

      color: var(--icon-color);

      filter:
        drop-shadow(
          0 1px 0 rgba(255, 255, 255, 0.72)
        );

      transition:
        transform 150ms ease;
    }

    /* =========================================================
       PRIMARY / SELECTED
       ========================================================= */

    .nav-item.primary {
      --surface-top: #62defb;
      --surface-bottom: #08a6db;

      --rim-dark: rgba(0, 103, 174, 0.96);
      --rim-medium: rgba(50, 196, 239, 0.94);
      --rim-light: rgba(219, 251, 255, 1);

      --text-color: #ffffff;
      --icon-color: #ffffff;
      --outer-glow: rgba(0, 181, 240, 0.54);

      box-shadow:
        0 1px 1px rgba(255, 255, 255, 0.92),
        0 4px 6px rgba(0, 104, 168, 0.23),
        0 11px 19px rgba(0, 128, 186, 0.23),
        0 0 15px var(--outer-glow);
    }

    /*
      Bright aqua selected indicator at the left side.
    */
    .active-marker {
      position: absolute;
      z-index: 6;

      left: -7px;
      top: 7px;
      bottom: 7px;

      width: 7px;

      border-radius: 999px;

      background:
        linear-gradient(
          180deg,
          rgba(127, 239, 255, 1) 0%,
          #0ec5ef 27%,
          #00a9df 72%,
          rgba(111, 232, 255, 0.96) 100%
        );

      box-shadow:
        inset 1px 0 2px rgba(255, 255, 255, 0.88),
        inset -1px 0 2px rgba(0, 99, 169, 0.4),
        0 0 7px rgba(0, 190, 241, 0.72),
        0 0 13px rgba(0, 171, 231, 0.35);
    }

    .primary .nav-surface {
      background:
        /* Top glass illumination */
        radial-gradient(
          ellipse 95% 105% at 50% -28%,
          rgba(255, 255, 255, 0.76) 0%,
          rgba(226, 250, 255, 0.28) 38%,
          transparent 70%
        ),

        /* Slightly brighter left side */
        radial-gradient(
          ellipse 68% 135% at 0% 50%,
          rgba(111, 230, 250, 0.28),
          transparent 73%
        ),

        linear-gradient(
          180deg,
          var(--surface-top) 0%,
          #20c2ee 48%,
          var(--surface-bottom) 100%
        );

      box-shadow:
        0 0 0 1px rgba(0, 109, 182, 0.34),

        inset 0 4px 6px rgba(0, 102, 173, 0.14),
        inset 0 2px 2px rgba(255, 255, 255, 0.68),
        inset 0 -5px 6px rgba(0, 86, 163, 0.28);
    }

    .primary .nav-label {
      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.55),
        0 0 3px rgba(255, 255, 255, 0.42),
        0 2px 3px rgba(0, 83, 155, 0.42);
    }

    .primary .nav-icon,
    .primary .nav-chevron {
      filter:
        drop-shadow(
          0 1px 0 rgba(255, 255, 255, 0.58)
        )
        drop-shadow(
          0 2px 2px rgba(0, 87, 158, 0.38)
        );
    }

    /*
      Lower-right lens glint visible on the selected item.
    */
    .selected-glare {
      position: absolute;
      z-index: 5;
      pointer-events: none;

      right: -2px;
      bottom: -2px;

      width: 76px;
      height: 36px;

      background:
        radial-gradient(
          ellipse 50px 6px at 64% 72%,
          rgba(255, 255, 255, 1) 0%,
          rgba(228, 250, 255, 0.84) 21%,
          rgba(95, 212, 252, 0.34) 48%,
          transparent 80%
        ),

        radial-gradient(
          ellipse 5px 28px at 64% 72%,
          rgba(255, 255, 255, 0.95) 0%,
          rgba(218, 248, 255, 0.55) 26%,
          transparent 75%
        );

      filter: blur(0.7px);
    }

    /* =========================================================
       SECONDARY / UNSELECTED
       ========================================================= */

    .nav-item.secondary {
      --surface-top: rgba(238, 249, 253, 0.99);
      --surface-bottom: rgba(205, 231, 241, 0.99);

      --rim-dark: rgba(28, 118, 169, 0.68);
      --rim-medium: rgba(135, 211, 237, 0.74);
      --rim-light: rgba(235, 253, 255, 0.98);

      --text-color: #125b8c;
      --icon-color: #115f94;
      --outer-glow: rgba(68, 171, 214, 0.18);
    }

    .secondary .nav-label {
      /*
        Small inset impression rather than a floating shadow.
      */
      text-shadow:
        -1px -1px 0 rgba(9, 76, 123, 0.18),
        1px 1px 0 rgba(255, 255, 255, 0.74);
    }

    /* =========================================================
       INTERACTIONS
       ========================================================= */

    .nav-item:hover {
      transform: translateY(-1px);

      filter:
        brightness(1.035)
        saturate(1.02);
    }

    .nav-item:hover .nav-rim {
      filter:
        blur(0.35px)
        brightness(1.08)
        saturate(1.05);
    }

    .nav-item:hover .nav-chevron {
      transform: translateX(3px);
    }

    .nav-item.secondary:hover {
      --surface-top: rgba(245, 253, 255, 1);
      --surface-bottom: rgba(215, 238, 247, 1);
      --outer-glow: rgba(72, 190, 231, 0.31);

      box-shadow:
        0 1px 1px rgba(255, 255, 255, 0.94),
        0 4px 6px rgba(22, 97, 145, 0.17),
        0 11px 19px rgba(30, 120, 169, 0.16),
        0 0 17px var(--outer-glow);
    }

    .nav-item.primary:hover {
      --outer-glow: rgba(29, 199, 246, 0.7);

      box-shadow:
        0 1px 1px rgba(255, 255, 255, 0.98),
        0 4px 6px rgba(0, 104, 168, 0.22),
        0 12px 21px rgba(0, 128, 186, 0.25),
        0 0 20px var(--outer-glow);
    }

    .nav-item:active {
      transform: translateY(2px);

      filter:
        brightness(0.96)
        saturate(0.99);

      box-shadow:
        0 1px 2px rgba(16, 82, 126, 0.22),
        0 5px 8px rgba(21, 97, 141, 0.15),
        0 0 9px var(--outer-glow);
    }

    .nav-item:active .nav-surface {
      box-shadow:
        0 0 0 1px rgba(8, 76, 122, 0.28),

        inset 0 7px 11px rgba(18, 91, 137, 0.19),
        inset 0 2px 3px rgba(17, 84, 129, 0.1),
        inset 0 -1px 2px rgba(255, 255, 255, 0.4);
    }

    .nav-item:active .nav-content {
      transform: translateY(1px);
    }

    .nav-item:focus-visible {
      outline:
        3px solid rgba(255, 255, 255, 0.98);

      outline-offset: 6px;

      box-shadow:
        0 0 0 4px rgba(39, 151, 207, 0.43),
        0 9px 17px rgba(28, 110, 158, 0.17),
        0 0 18px rgba(72, 191, 237, 0.4);
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 500px) {
      :root {
        --nav-height: 68px;
        --nav-radius: 19px;
        --rim-width: 5px;
      }

      body {
        padding: 24px 20px;
      }

      .nav-item {
        padding-left: 20px;
        padding-right: 17px;
      }

      .nav-content {
        gap: 14px;
      }

      .nav-icon {
        width: 37px;
        height: 37px;
      }

      .nav-label {
        font-size: 23px;
      }

      .nav-chevron {
        width: 19px;
        height: 29px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-item,
      .nav-rim,
      .nav-icon,
      .nav-chevron {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="sidebar-demo">
    <h1 class="demo-title">Sidebar Nav Item</h1>

    <nav class="nav-list" aria-label="Library navigation">
      <!-- Selected / primary -->
      <button
        class="nav-item primary"
        type="button"
        aria-current="page"
      >
        <span
          class="active-marker"
          aria-hidden="true"
        ></span>

        <span
          class="nav-rim"
          aria-hidden="true"
        ></span>

        <span
          class="nav-surface"
          aria-hidden="true"
        ></span>

        <span
          class="selected-glare"
          aria-hidden="true"
        ></span>

        <span class="nav-content">
          <svg
            class="nav-icon"
            viewBox="0 0 48 48"
            aria-hidden="true"
          >
            <!-- CD outer edge -->
            <circle
              cx="24"
              cy="24"
              r="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2.8"
            />

            <!-- CD hub -->
            <circle
              cx="24"
              cy="24"
              r="5.2"
              fill="none"
              stroke="currentColor"
              stroke-width="2.8"
            />

            <!-- Reflective arcs -->
            <path
              d="M13.2 18
                 A13 13 0 0 1 19 12.7"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            />

            <path
              d="M34.8 30
                 A13 13 0 0 1 29 35.3"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            />

            <!-- Small optical details -->
            <circle
              cx="34.2"
              cy="17.2"
              r="1.7"
              fill="currentColor"
            />

            <circle
              cx="14"
              cy="29"
              r="1.4"
              fill="currentColor"
            />
          </svg>

          <span class="nav-label">Library</span>

          <svg
            class="nav-chevron"
            viewBox="0 0 24 36"
            aria-hidden="true"
          >
            <path
              d="M6 4 L18 18 L6 32"
              fill="none"
              stroke="currentColor"
              stroke-width="3.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>

      <!-- Unselected / secondary -->
      <button
        class="nav-item secondary"
        type="button"
      >
        <span
          class="nav-rim"
          aria-hidden="true"
        ></span>

        <span
          class="nav-surface"
          aria-hidden="true"
        ></span>

        <span class="nav-content">
          <svg
            class="nav-icon"
            viewBox="0 0 48 48"
            aria-hidden="true"
          >
            <circle
              cx="24"
              cy="24"
              r="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2.8"
            />

            <circle
              cx="24"
              cy="24"
              r="5.2"
              fill="none"
              stroke="currentColor"
              stroke-width="2.8"
            />

            <path
              d="M13.2 18
                 A13 13 0 0 1 19 12.7"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            />

            <path
              d="M34.8 30
                 A13 13 0 0 1 29 35.3"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            />

            <circle
              cx="34.2"
              cy="17.2"
              r="1.7"
              fill="currentColor"
            />

            <circle
              cx="14"
              cy="29"
              r="1.4"
              fill="currentColor"
            />
          </svg>

          <span class="nav-label">Library</span>

          <svg
            class="nav-chevron"
            viewBox="0 0 24 36"
            aria-hidden="true"
          >
            <path
              d="M6 4 L18 18 L6 32"
              fill="none"
              stroke="currentColor"
              stroke-width="3.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </button>
    </nav>
  </main>
</body>
</html>
